<style>
:root{
  --bg1:#e4f1fc;--bg2:#d6e9fa;--bg3:#e8f2fc;
  --surface:#ffffff;--surface2:#f1f8ff;--text:#33465f;--muted:#7a8ea8;--line:#b9d6f0;
  --c:#1f78c8;--cd:#0f4f8f;
  --mint:#7fd8be;--mint-d:#1f5b4a;--pink:#ffa6c1;--pink-d:#7a2448;--blue:#1f78c8;--blue-d:#0f4f8f;
  --ok-bg:#dff7ee;--ok-bd:#5fb99e;--bad-bg:#ffe3ec;--bad-bd:#e888a6;
  --shadow:0 14px 34px rgba(20,90,160,.28);
  --head:"Fredoka","Nunito","Segoe UI",Roboto,Arial,sans-serif;
}
[data-theme=dark]{--bg1:#0a1a30;--bg2:#0d2240;--bg3:#09172b;--surface:#1b2943;--surface2:#22314f;--text:#e8effb;--muted:#a3b4d1;--line:#35486c;--ok-bg:#16463a;--ok-bd:#3f9b7f;--bad-bg:#52243a;--bad-bd:#c8607f;--shadow:0 14px 34px rgba(0,0,0,.5);--mint-d:#0f3a2e;--pink-d:#4a1530}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Nunito","Segoe UI",Roboto,Arial,sans-serif;color:var(--text);min-height:100vh;min-height:100dvh;
  background:radial-gradient(circle,rgba(31,120,200,.14) 2.5px,transparent 3px) 0 0/34px 34px,linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3));background-attachment:fixed;
  display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px 14px calc(24px + env(safe-area-inset-bottom));padding-top:max(12px,env(safe-area-inset-top));-webkit-tap-highlight-color:transparent}
.wrap{width:100%;max-width:820px;display:flex;flex-direction:column;gap:12px}
header{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;background:color-mix(in srgb,var(--surface) 80%,transparent);backdrop-filter:blur(8px);border:3px dashed var(--c);border-radius:28px;padding:8px 16px}
h1{font-family:var(--head);font-size:1.05rem;margin:0;font-weight:600;display:flex;gap:8px;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{font-size:.8rem;font-weight:800;padding:4px 11px;border-radius:999px;background:var(--surface2);border:2px solid var(--line)}
.chip.k{background:var(--mint);color:var(--mint-d);border-color:transparent}
.chip.u{background:var(--pink);color:var(--pink-d);border-color:transparent}
button{font-family:inherit;font-weight:800;font-size:.92rem;padding:9px 18px;border-radius:999px;border:3px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer;box-shadow:0 4px 0 var(--line);transition:transform .12s,box-shadow .12s}
button:hover{transform:translateY(-2px)}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
button:disabled{opacity:.45;cursor:default;transform:none}
button.pri{background:var(--blue);color:#fff;border-color:transparent;box-shadow:0 4px 0 var(--blue-d)}
button.know{background:var(--mint);color:var(--mint-d);border-color:transparent;box-shadow:0 4px 0 #5fb99e}
button.dont{background:var(--pink);color:var(--pink-d);border-color:transparent;box-shadow:0 4px 0 #e888a6}
button.sm{font-size:.8rem;padding:6px 13px}
.ib{padding:3px 9px;font-size:.95rem;border-width:2px;box-shadow:0 2px 0 var(--line)}
.tabs{display:flex;gap:8px}
.tabs button{flex:1;font-family:var(--head);font-size:1rem;font-weight:500;padding:10px 14px}
.tabs button.on{background:var(--c);color:#fff;border-color:transparent;box-shadow:0 4px 0 var(--cd)}
.panel{background:var(--surface);border:4px solid var(--c);border-radius:30px;box-shadow:var(--shadow);padding:22px 24px;position:relative}
.panel h2{font-family:var(--head);font-weight:600;font-size:1.3rem;margin:0 0 6px}
.muted{color:var(--muted);font-weight:700;font-size:.9rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--surface2);border:3px dashed var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card h3{margin:0;font-family:var(--head);font-weight:600;font-size:1.1rem}
select,textarea{font-family:inherit;font-weight:700;font-size:.95rem;color:var(--text);background:var(--surface);border:3px solid var(--line);border-radius:14px;padding:8px 10px;width:100%}
textarea{min-height:120px;resize:vertical;line-height:1.55}
label.row{display:flex;gap:8px;align-items:center;font-weight:700;font-size:.9rem}
.bar{height:14px;border:3px solid var(--line);border-radius:999px;background:var(--surface);overflow:hidden;display:flex}
.bar i{display:block;height:100%;transition:width .4s}
.bar .k{background:repeating-linear-gradient(45deg,var(--mint),var(--mint) 10px,#a4ecd7 10px,#a4ecd7 20px)}
.bar .u{background:repeating-linear-gradient(45deg,var(--pink),var(--pink) 10px,#ffc7d9 10px,#ffc7d9 20px)}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.tag{display:inline-flex;gap:8px;align-items:center;font-size:.78rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:5px 14px;border-radius:999px;background:var(--c);color:#fff}
.tag b{background:#fff;color:var(--cd);border-radius:999px;padding:0 8px}
.qtxt{font-family:var(--head);font-weight:500;font-size:1.3rem;line-height:1.5;margin:6px 0 16px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border-radius:20px;padding:11px 14px;font-weight:700;font-size:1rem;line-height:1.45;box-shadow:0 3px 0 var(--line);border-width:3px}
.opt .l{flex:none;width:30px;height:30px;border-radius:50%;background:var(--surface2);border:2px solid var(--line);display:grid;place-items:center;font-family:var(--head);font-weight:600}
.opt.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--surface))}
.opt.sel .l{background:var(--c);color:#fff;border-color:transparent}
.opt.ok{background:var(--ok-bg);border-color:var(--ok-bd);box-shadow:0 3px 0 var(--ok-bd)}
.opt.ok .l{background:var(--ok-bd);color:#fff;border-color:transparent}
.opt.bad{background:var(--bad-bg);border-color:var(--bad-bd);box-shadow:0 3px 0 var(--bad-bd)}
.opt.bad .l{background:var(--bad-bd);color:#fff;border-color:transparent}
.opt:disabled{opacity:1;cursor:default;transform:none}
.fb{margin-top:14px;border-radius:20px;padding:12px 16px;font-weight:700;line-height:1.5;border:3px dashed}
.fb.ok{background:var(--ok-bg);border-color:var(--ok-bd)}.fb.bad{background:var(--bad-bg);border-color:var(--bad-bd)}
.fb small{display:block;margin-top:6px;color:var(--muted);font-weight:700}
.nav{display:flex;gap:8px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin-top:14px}
.map button{padding:5px 0;font-size:.8rem;border-width:2px;box-shadow:none;border-radius:12px}
.map button.cur{outline:3px solid var(--c);outline-offset:1px}
.map button.done{background:color-mix(in srgb,var(--c) 22%,var(--surface))}
.map button.ok{background:var(--ok-bg);border-color:var(--ok-bd)}
.map button.bad{background:var(--bad-bg);border-color:var(--bad-bd)}
.mascot{width:90px;display:block;margin:0 auto;filter:drop-shadow(0 6px 6px rgba(60,100,150,.2));animation:bob 3.2s ease-in-out infinite}
[data-theme=dark] .mascot{filter:drop-shadow(0 0 6px rgba(255,255,255,.3))}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
.score{text-align:center}
.score .pct{font:600 2.8rem var(--head);color:var(--c)}
.rev{display:flex;flex-direction:column;gap:12px;margin-top:14px;text-align:left}
.rev .it{border:3px solid var(--line);border-radius:20px;padding:12px 14px;background:var(--surface2)}
.rev .it .q{font-weight:800;margin-bottom:6px}
.rev .it div{font-size:.92rem;line-height:1.5;font-weight:700}
.rev .y{color:#1f8a5e}.rev .n{color:#c2457a}

phủ."], ["C", "Các cộng đồng làng xã. ."], ["D", "Các tổ chức phi chính phủ quốc tế."]], "k": "C", "flag": false}, {"n": 111, "q": "Toàn cầu hóa có tác động như thế nào đến các quốc gia đang phát triển:", "o": [["A", "Chỉ mang lại những thách thức và khó khăn."], ["B", "Chỉ tạo ra những cơ hội phát triển vượt bậc."], ["C", "Vừa tạo ra cơ hội phát triển, vừa đặt ra những thách thức không nhỏ. ."], ["D", "Không có tác động đáng kể."]], "k": "C", "flag": false}, {"n": 112, "q": "Khu vực hóa trong chính trị quốc tế là quá trình:", "o": [["A", "Các quốc gia trong cùng khu vực địa lý tăng cường hợp tác trên nhiều lĩnh vực. ."], ["B", "Một quốc gia đơn phương mở rộng ảnh hưởng ra toàn cầu."], ["C", "Các tổ chức quốc tế chi phối chính sách của các quốc gia thành viên."], ["D", "Sự phân chia thế giới thành các khối quân sự đối lập."]], "k": "A", "flag": false}, {"n": 113, "q": "Định hướng xã hội chủ nghĩa ở Việt Nam được Đảng Cộng sản Việt Nam xác định dựa trên nền tảng lý luận:", "o": [["A", "Chủ nghĩa tự do mới."], ["B", "Chủ nghĩa dân tộc cực đoan."], ["C", "Chủ nghĩa Mác - Lênin và tư tưởng Hồ Chí Minh. ."], ["D", "Chủ nghĩa bảo thủ."]], "k": "C", "flag": false}, {"n": 114, "q": "Mục tiêu tổng quát của định hướng xã hội chủ nghĩa ở Việt Nam là xây dựng một xã hội như thế nào:", "o": [["A", "Giàu có về kinh tế, hùng mạnh về quân sự."], ["B", "Dân chủ, tự do và nhân quyền tuyệt đối."], ["C", "Dân giàu, nước mạnh, dân chủ, công bằng, văn minh. ."], ["D", "Ổn định về chính trị, trật tự về xã hội."]], "k": "C", "flag": false}, {"n": 115, "q": "Đâu là một trong những đặc trưng cơ bản của xã hội xã hội chủ nghĩa mà Việt Nam đang xây dựng:", "o": [["A", "Nền kinh tế thị trường tự do tuyệt đối."], ["B", "Nhà nước pháp quyền tư sản."], ["C", "Dân làm chủ. ."], ["D", "Xã hội không có giai cấp."]], "k": "C", "flag": false}, {"n": 116, "q": "Trong quá trình xây dựng chủ nghĩa xã hội, Việt Nam xác định phát triển kinh tế theo mô hình:", "o": [["A", "Kinh tế kế hoạch hóa tập trung."], ["B", "Kinh tế tự cung tự cấp."], ["C", "Kinh tế thị trường định hướng xã hội chủ nghĩa. ."], ["D", "Kinh tế đóng cửa, tự lực hoàn toàn."]], "k": "C", "flag": false}, {"n": 117, "q": "Yếu tố nào được Đảng Cộng sản Việt Nam xác định là nền tảng tư tưởng, kim chỉ nam cho hành động của Đảng và Nhà nước:", "o": [["A", "Chủ nghĩa Tam Dân."], ["B", "Học thuyết Khổng Tử."], ["C", "Chủ nghĩa Mác - Lênin và tư tưởng Hồ Chí Minh. ."], ["D", "Chủ nghĩa thực dụng."]], "k": "C", "flag": false}, {"n": 118, "q": "Trong bối cảnh chính trị quốc tế phức tạp, Việt Nam thực hiện đường lối đối ngoại như thế nào:", "o": [["A", "Chỉ liên minh với các nước xã hội chủ nghĩa."], ["B", "Theo đuổi chính sách đối ngoại đóng cửa."], ["C", "Độc lập, tự chủ, hòa bình, hữu nghị, hợp tác và phát triển, đa phương hóa, đa dạng hóa quan hệ đối ngoại. ."], ["D", "Ưu tiên liên minh quân sự với các cường quốc."]], "k": "C", "flag": false}, {"n": 119, "q": "Một trong những thách thức lớn đối với định hướng xã hội chủ nghĩa ở Việt Nam trong bối cảnh quốc tế hiện nay là:", "o": [["A", "Sự suy yếu của các nước xã hội chủ nghĩa trên thế giới."], ["B", "Áp lực từ các tổ chức quốc tế về vấn đề nhân quyền."], ["C", "Những diễn biến phức tạp, khó lường của tình hình chính trị, kinh tế thế giới và khu vực. ."], ["D", "Sự thiếu hụt nguồn lực tự nhiên."]], "k": "C", "flag": false}, {"n": 120, "q": "Yếu tố nào sau đây đóng vai trò quyết định trong việc đảm bảo định hướng xã hội chủ nghĩa ở Việt Nam trong bối cảnh hội nhập quốc tế:", "o": [["A", "Sự ủng hộ tuyệt đối của cộng đồng quốc tế."], ["B", "Việc duy trì một nền kinh tế kế hoạch hóa tập trung."], ["C", "Sự lãnh đạo đúng đắn của Đảng Cộng sản Việt Nam và sự đồng thuận của nhân dân. ."], ["D", "Việc đóng cửa hoàn toàn nền kinh tế với bên ngoài."]], "k": "C", "flag": false}], "essay": [{"n": 1, "q": "Chính trị là gì? Phân tích luận điểm: chính trị vừa là khoa học, vừa là nghệ thuật.", "a": [{"t": "h", "x": "Khái niệm chính trị"}, {"t": "p", "x": "Chính trị là lĩnh vực hoạt động gắn liền với quan hệ giữa các giai cấp, dân tộc, quốc gia trong vấn đề giành, giữ, tổ chức và sử dụng quyền lực nhà nước nhằm bảo vệ và thực hiện lợi ích của các chủ thể chính trị."}, {"t": "h", "x": "Chính trị vừa là khoa học"}, {"t": "li", "x": "Chính trị phản ánh những quy luật khách quan của đời sống xã hội."}, {"t": "li", "x": "Hoạt động chính trị phải dựa trên cơ sở lý luận và thực tiễn."}, {"t": "li", "x": "Phải nhận thức đúng mối quan hệ giữa kinh tế, chính trị và xã hội."}, {"t": "li", "x": "Phải biết dự báo tình hình và hoạch định đường lối, chính sách phù hợp."}, {"t": "h", "x": "Chính trị vừa là nghệ thuật"}, {"t": "li", "x": "Là nghệ thuật tập hợp, tổ chức và lãnh đạo quần chúng."}, {"t": "li", "x": "Là nghệ thuật xử lý các mối quan hệ và mâu thuẫn lợi ích."}, {"t": "li", "x": "Là nghệ thuật lựa chọn thời cơ, phương pháp và cách thức hành động."}, {"t": "li", "x": "Đòi hỏi người lãnh đạo có bản lĩnh, kinh nghiệm, sự linh hoạt và khả năng thuyết phục."}, {"t": "h", "x": "Kết luận"}, {"t": "p", "x": "Khoa học cung cấp cơ sở lý luận và phương pháp nhận thức; nghệ thuật giúp vận dụng những tri thức đó vào thực tiễn. Hai yếu tố có quan hệ thống nhất, không thể tách rời trong hoạt động chính trị."}]}, {"n": 2, "q": "Phân tích nội tư tưởng chính trị Hy Lạp thời kỳ cổ đại và những giá trị, ý nghĩa của nó đương thời và hiện nay?", "a": [{"t": "h", "x": "Khái quát"}, {"t": "p", "x": "Tư tưởng chính trị Hy Lạp cổ đại hình thành trong điều kiện các thành bang phát triển, đặc biệt là Athens. Đây là một trong những cái nôi quan trọng của tư tưởng chính trị phương Tây."}, {"t": "h", "x": "Những nhà tư tưởng tiêu biểu"}, {"t": "li", "x": "Hêrôđốt: Phân biệt các thể chế quân chủ, quý tộc và dân chủ; quan tâm đến cách tổ chức quyền lực."}, {"t": "li", "x": "Xênôphôn: Đề cập vai trò, phẩm chất và năng lực của người thủ lĩnh chính trị."}, {"t": "li", "x": "Platon: Đề cao vai trò trí tuệ trong cai trị; xây dựng quan niệm về nhà nước lý tưởng với các tầng lớp có chức năng khác nhau."}, {"t": "li", "x": "Arixtốt: Cho rằng con người là động vật chính trị, nhà nước hình thành một cách tự nhiên trong quá trình phát triển của cộng đồng."}, {"t": "h", "x": "Giá trị và ý nghĩa"}, {"t": "li", "x": "Đặt nền móng cho khoa học chính trị phương Tây."}, {"t": "li", "x": "Đề cập vấn đề tổ chức và phân loại thể chế chính trị."}, {"t": "li", "x": "Khẳng định vai trò của tri thức, đạo đức và năng lực người lãnh đạo."}, {"t": "li", "x": "Nhấn mạnh mối quan hệ giữa cá nhân và cộng đồng."}, {"t": "li", "x": "Gợi mở những vấn đề về công bằng, quản lý xã hội và trách nhiệm công dân."}, {"t": "h", "x": "Hạn chế"}, {"t": "p", "x": "Tư tưởng chính trị thời kỳ này vẫn chịu ảnh hưởng của chế độ chiếm hữu nô lệ, chưa thừa nhận quyền bình đẳng của tất cả mọi người."}, {"t": "h", "x": "Kết luận"}, {"t": "p", "x": "Tư tưởng chính trị Hy Lạp cổ đại có giá trị lịch sử lớn, tạo nền tảng cho sự phát triển của lý luận nhà nước và chính trị học hiện đại."}]}, {"n": 3, "q": "Phân tích các tư tưởng chính trị Phái Nho Gia và những giá trị và ý nghĩa của nó đương thời và hiện nay.", "a": [{"t": "h", "x": "Khái quát"}, {"t": "p", "x": "Nho Gia là một trường phái tư tưởng lớn của Trung Quốc thời Xuân Thu – Chiến Quốc. Người sáng lập là Khổng Tử."}, {"t": "h", "x": "Những nội dung cơ bản"}, {"t": "li", "x": "Nhân: Lòng yêu thương con người, biết quan tâm đến người khác, lấy con người làm trung tâm trong quan hệ xã hội."}, {"t": "li", "x": "Lễ: Những quy tắc, chuẩn mực điều chỉnh hành vi và quan hệ giữa con người với nhau."}, {"t": "li", "x": "Chính danh: Mỗi người phải ở đúng vị trí, thực hiện đúng chức trách và bổn phận của mình."}, {"t": "p", "x": "Ngoài ra, Nho Gia còn đề cao:"}, {"t": "li", "x": "Đức trị trong quản lý xã hội."}, {"t": "li", "x": "Vai trò của người hiền tài."}, {"t": "li", "x": "Tu dưỡng đạo đức của người cầm quyền."}, {"t": "li", "x": "Tư tưởng thân dân và ổn định trật tự xã hội."}, {"t": "h", "x": "Giá trị và ý nghĩa"}, {"t": "li", "x": "Đề cao đạo đức, nhân nghĩa và trách nhiệm xã hội."}, {"t": "li", "x": "Khuyến khích học tập, giáo dục và trọng dụng nhân tài."}, {"t": "li", "x": "Đề cao trách nhiệm của người lãnh đạo."}, {"t": "li", "x": "Góp phần xây dựng các chuẩn mực đạo đức và văn hóa ứng xử."}, {"t": "h", "x": "Hạn chế"}, {"t": "li", "x": "Có yếu tố bảo vệ trật tự đẳng cấp phong kiến."}, {"t": "li", "x": "Đề cao tôn ti, thứ bậc, đôi khi hạn chế tính bình đẳng."}, {"t": "li", "x": "Một số quan niệm có thể trở nên bảo thủ nếu áp dụng máy móc."}, {"t": "h", "x": "Liên hệ hiện nay"}, {"t": "p", "x": "Cần kế thừa tinh thần nhân ái, trọng dụng nhân tài, đề cao trách nhiệm và đạo đức của cán bộ; đồng thời loại bỏ những tư tưởng lạc hậu, bất bình đẳng."}]}, {"n": 4, "q": "Phân tích các tư tưởng chính trị Phái Pháp gia và những giá trị và ý nghĩa của nó đương thời và hiện nay.", "a": [{"t": "h", "x": "Khái quát"}, {"t": "p", "x": "Pháp Gia phát triển mạnh thời Xuân Thu – Chiến Quốc. Đại diện tiêu biểu là Hàn Phi Tử."}, {"t": "h", "x": "Nội dung cơ bản"}, {"t": "p", "x": "Học thuyết Pháp trị được xây dựng trên ba yếu tố:"}, {"t": "li", "x": "Pháp: Hệ thống pháp luật, quy tắc và chuẩn mực dùng để quản lý xã hội."}, {"t": "li", "x": "Thế: Địa vị và quyền lực của người đứng đầu nhà nước."}, {"t": "li", "x": "Thuật: Phương pháp, kỹ năng và nghệ thuật quản lý, kiểm soát bộ máy quan lại."}, {"t": "p", "x": "Hàn Phi Tử cho rằng muốn quản lý xã hội hiệu quả phải dựa vào pháp luật, quyền lực và phương pháp quản lý chặt chẽ."}, {"t": "h", "x": "Giá trị và ý nghĩa"}, {"t": "li", "x": "Đề cao vai trò của pháp luật trong quản lý xã hội."}, {"t": "li", "x": "Nhấn mạnh tính thống nhất trong quản lý nhà nước."}, {"t": "li", "x": "Đề cao trách nhiệm của đội ngũ quan lại."}, {"t": "li", "x": "Chú trọng hiệu quả thực thi chính sách."}, {"t": "li", "x": "Có ý nghĩa tham khảo trong xây dựng nhà nước pháp quyền."}, {"t": "h", "x": "Hạn chế"}, {"t": "li", "x": "Quá đề cao quyền lực của người đứng đầu."}, {"t": "li", "x": "Coi trọng thưởng phạt và cưỡng chế."}, {"t": "li", "x": "Chưa đề cao đầy đủ quyền con người và quyền công dân."}, {"t": "h", "x": "Liên hệ hiện nay"}, {"t": "p", "x": "Cần kế thừa tinh thần thượng tôn pháp luật, quản lý xã hội bằng pháp luật, nhưng phải kết hợp pháp luật với giáo dục, đạo đức và bảo đảm quyền con người."}]}, {"n": 5, "q": "Phân tích tư tưởng Hồ Chí Minh về: Độc lập dân tộc gắn liền với chủ nghĩa xã hội và sự vận dụng của Đảng ta trong tiến trình cách mạng từ 1930 tới nay?", "a": [{"t": "h", "x": "Nội dung tư tưởng Hồ Chí Minh"}, {"t": "p", "x": "Độc lập dân tộc gắn liền với chủ nghĩa xã hội là tư tưởng xuyên suốt trong đường lối cách mạng Việt Nam."}, {"t": "li", "x": "Độc lập dân tộc là điều kiện tiên quyết để xây dựng chủ nghĩa xã hội."}, {"t": "li", "x": "Chủ nghĩa xã hội là cơ sở bảo đảm độc lập dân tộc vững chắc."}, {"t": "li", "x": "Độc lập phải gắn với tự do, hạnh phúc của nhân dân."}, {"t": "li", "x": "Độc lập dân tộc không chỉ là thoát khỏi ách thống trị mà còn phải xây dựng đất nước phát triển."}, {"t": "h", "x": "Sự vận dụng từ năm 1930 đến nay"}, {"t": "li", "x": "Giai đoạn 1930–1945: Đảng ra đời, xác định nhiệm vụ giải phóng dân tộc; lãnh đạo nhân dân giành chính quyền năm 1945."}, {"t": "li", "x": "Giai đoạn 1945–1954: Xây dựng và bảo vệ chính quyền cách mạng, tiến hành kháng chiến chống thực dân Pháp."}, {"t": "li", "x": "Giai đoạn 1954–1975: Miền Bắc xây dựng chủ nghĩa xã hội, miền Nam đấu tranh giải phóng dân tộc, thống nhất đất nước."}, {"t": "li", "x": "Giai đoạn 1975–1986: Cả nước xây dựng chủ nghĩa xã hội, khắc phục khó khăn sau chiến tranh."}, {"t": "li", "x": "Từ năm 1986 đến nay: Tiến hành công cuộc đổi mới, phát triển kinh tế thị trường định hướng xã hội chủ nghĩa, mở rộng hội nhập quốc tế."}, {"t": "h", "x": "Ý nghĩa hiện nay"}, {"t": "li", "x": "Giữ vững độc lập, chủ quyền và toàn vẹn lãnh thổ."}, {"t": "li", "x": "Phát triển kinh tế gắn với tiến bộ và công bằng xã hội."}, {"t": "li", "x": "Nâng cao đời sống vật chất, tinh thần của nhân dân."}, {"t": "li", "x": "Giữ vững ổn định chính trị và tăng cường quốc phòng, an ninh."}, {"t": "li", "x": "Chủ động hội nhập quốc tế nhưng không đánh mất độc lập, tự chủ."}, {"t": "h", "x": "Kết luận"}, {"t": "p", "x": "Độc lập dân tộc gắn liền với chủ nghĩa xã hội là sự lựa chọn chiến lược của cách mạng Việt Nam, có ý nghĩa định hướng cho sự nghiệp xây dựng và bảo vệ Tổ quốc."}]}, {"n": 6, "q": "Phân tích quá trình hình thành quyền lực chính trị và sự chuyển hóa quyền lực chính trị thành quyền lực nhà nước?", "a": [{"t": "h", "x": "Khái niệm quyền lực chính trị"}, {"t": "p", "x": "Quyền lực chính trị là quyền sử dụng sức mạnh của một giai cấp hoặc liên minh giai cấp, tập đoàn xã hội nhằm thực hiện sự thống trị chính trị, chủ yếu thông qua đấu tranh giành, giữ và thực thi quyền lực nhà nước."}, {"t": "h", "x": "Quá trình hình thành quyền lực chính trị"}, {"t": "li", "x": "Xã hội xuất hiện sự phân hóa về lợi ích."}, {"t": "li", "x": "Các giai cấp, tầng lớp hình thành những lợi ích và mục tiêu chính trị khác nhau."}, {"t": "li", "x": "Các chủ thể tổ chức lực lượng, tập hợp quần chúng để bảo vệ lợi ích."}, {"t": "li", "x": "Hình thành các tổ chức chính trị và quan hệ quyền lực."}, {"t": "li", "x": "Xuất hiện đấu tranh nhằm giành quyền chi phối đời sống chính trị."}, {"t": "h", "x": "Sự chuyển hóa thành quyền lực nhà nước"}, {"t": "li", "x": "Một giai cấp hoặc liên minh giai cấp tập hợp lực lượng."}, {"t": "li", "x": "Tiến hành đấu tranh giành chính quyền."}, {"t": "li", "x": "Trở thành lực lượng nắm quyền thống trị chính trị."}, {"t": "li", "x": "Sử dụng nhà nước làm công cụ tổ chức và thực thi quyền lực."}, {"t": "li", "x": "Thể chế hóa quyền lực thông qua pháp luật, chính sách và bộ máy nhà nước."}, {"t": "h", "x": "Kết luận"}, {"t": "p", "x": "Quyền lực nhà nước là hình thức tập trung và tổ chức cao của quyền lực chính trị. Sự chuyển hóa này gắn liền với quá trình giành, giữ và thực thi quyền lực."}]}, {"n": 7, "q": "Trình bày khái niệm Đảng chính trị? Phân tích vai trò của Đảng chính trị trong hệ thống tổ chức quyền lực chính trị. Liên hệ với Đảng Cộng sản Việt Nam.", "a": [{"t": "h", "x": "Khái niệm"}, {"t": "p", "x": "Theo quan điểm Mác – Lênin, Đảng chính trị là bộ phận tích cực nhất, có tổ chức của một giai cấp hoặc tầng lớp xã hội, đại diện và bảo vệ lợi ích của giai cấp đó."}, {"t": "h", "x": "Vai trò của Đảng chính trị"}, {"t": "li", "x": "Đề ra cương lĩnh, đường lối và mục tiêu chính trị."}, {"t": "li", "x": "Tổ chức, tập hợp và lãnh đạo quần chúng."}, {"t": "li", "x": "Tham gia giành, giữ và thực thi quyền lực nhà nước."}, {"t": "li", "x": "Đào tạo, lựa chọn và bố trí cán bộ."}, {"t": "li", "x": "Xây dựng, kiểm tra và giám sát việc thực hiện chính sách."}, {"t": "li", "x": "Định hướng hoạt động của hệ thống chính trị."}, {"t": "h", "x": "Liên hệ Đảng Cộng sản Việt Nam"}, {"t": "p", "x": "Đảng Cộng sản Việt Nam là lực lượng lãnh đạo Nhà nước và xã hội."}, {"t": "sub", "x": "Vai trò thể hiện ở:"}, {"t": "li", "x": "Đề ra đường lối phát triển đất nước."}, {"t": "li", "x": "Lãnh đạo công cuộc đổi mới."}, {"t": "li", "x": "Lãnh đạo xây dựng Nhà nước pháp quyền xã hội chủ nghĩa."}, {"t": "li", "x": "Lãnh đạo phát triển kinh tế, văn hóa và xã hội."}, {"t": "li", "x": "Tăng cường xây dựng, chỉnh đốn Đảng."}, {"t": "li", "x": "Phòng chống tham nhũng, tiêu cực."}, {"t": "li", "x": "Phát huy quyền làm chủ của nhân dân."}, {"t": "h", "x": "Kết luận"}, {"t": "p", "x": "Đảng chính trị có vai trò quan trọng trong tổ chức và vận hành hệ thống quyền lực chính trị. Đảng phải thường xuyên đổi mới, nâng cao năng lực lãnh đạo và gắn bó với nhân dân."}]}, {"n": 8, "q": "Thủ lĩnh chính trị là gì? Phân tích vai trò của người thủ lĩnh chính trị? Liên hệ với thủ lĩnh chính trị ở Việt Nam.", "a": [{"t": "h", "x": "Khái niệm"}, {"t": "p", "x": "Thủ lĩnh chính trị là người đứng đầu hoặc giữ vai trò lãnh đạo trong một tổ chức chính trị, có khả năng định hướng, tập hợp và tổ chức quần chúng thực hiện mục tiêu chính trị."}, {"t": "h", "x": "Vai trò"}, {"t": "li", "x": "Đề ra mục tiêu, phương hướng và chiến lược hoạt động."}, {"t": "li", "x": "Tập hợp, đoàn kết quần chúng."}, {"t": "li", "x": "Tổ chức và điều hành hoạt động chính trị."}, {"t": "li", "x": "Đưa ra quyết định và xử lý các tình huống."}, {"t": "li", "x": "Đại diện cho lợi ích của tổ chức và lực lượng chính trị."}, {"t": "li", "x": "Tạo động lực và thúc đẩy sự phát triển xã hội."}, {"t": "h", "x": "Liên hệ Việt Nam"}, {"t": "p", "x": "Thủ lĩnh chính trị ở Việt Nam thể hiện qua đội ngũ cán bộ lãnh đạo của Đảng, Nhà nước và các tổ chức chính trị – xã hội."}, {"t": "sub", "x": "Người lãnh đạo cần:"}, {"t": "li", "x": "Có bản lĩnh chính trị vững vàng."}, {"t": "li", "x": "Trung thành với lợi ích của Tổ quốc và nhân dân."}, {"t": "li", "x": "Có năng lực tổ chức, quản lý."}, {"t": "li", "x": "Gần dân, trọng dân và hiểu dân."}, {"t": "li", "x": "Có đạo đức trong sáng."}, {"t": "li", "x": "Kiên quyết đấu tranh với tham nhũng, tiêu cực."}, {"t": "h", "x": "Kết luận"}, {"t": "p", "x": "Thủ lĩnh chính trị có vai trò quan trọng trong việc định hướng và tổ chức hoạt động chính trị. Chất lượng lãnh đạo ảnh hưởng trực tiếp đến hiệu quả hoạt động của hệ thống chính trị."}]}, {"n": 9, "q": "Phân tích phẩm chất của thủ lĩnh chính trị, liên hệ với phẩm chất của Thủ lĩnh chính trị ở Việt Nam hiện nay?", "a": [{"t": "h", "x": "Các nhóm phẩm chất"}, {"t": "p", "x": "Có thể chia thành ba nhóm cơ bản:"}, {"t": "sub", "x": "Thứ nhất, trình độ hiểu biết"}, {"t": "li", "x": "Có kiến thức sâu rộng."}, {"t": "li", "x": "Có tư duy khoa học."}, {"t": "li", "x": "Nắm vững các quy luật chính trị và xã hội."}, {"t": "li", "x": "Có khả năng phân tích, dự báo tình hình."}, {"t": "li", "x": "Nắm bắt khoa học và công nghệ lãnh đạo, quản lý."}, {"t": "sub", "x": "Thứ hai, phẩm chất chính trị"}, {"t": "li", "x": "Có lập trường chính trị vững vàng."}, {"t": "li", "x": "Giác ngộ mục tiêu, lý tưởng của giai cấp."}, {"t": "li", "x": "Có tinh thần trách nhiệm."}, {"t": "li", "x": "Trung thành với lợi ích của nhân dân và đất nước."}, {"t": "li", "x": "Có bản lĩnh trước khó khăn, thử thách."}, {"t": "sub", "x": "Thứ ba, năng lực tổ chức, đạo đức và tác phong"}, {"t": "li", "x": "Có khả năng tập hợp, đoàn kết quần chúng."}, {"t": "li", "x": "Biết tổ chức và điều hành công việc."}, {"t": "li", "x": "Có khả năng ra quyết định."}, {"t": "li", "x": "Trung thực, liêm khiết, gương mẫu."}, {"t": "li", "x": "Có phong cách làm việc khoa học, dân chủ và gần dân."}, {"t": "h", "x": "Liên hệ Việt Nam hiện nay"}, {"t": "p", "x": "Cán bộ lãnh đạo cần không ngừng học tập, nâng cao trình độ, có bản lĩnh chính trị và đạo đức tốt; dám nghĩ, dám làm, dám chịu trách nhiệm vì lợi ích chung."}, {"t": "p", "x": "Đặc biệt cần phòng chống chủ nghĩa cá nhân, quan liêu, tham nhũng và lãng phí."}, {"t": "h", "x": "Kết luận"}, {"t": "p", "x": "Phẩm chất của thủ lĩnh chính trị là sự thống nhất giữa trí tuệ, bản lĩnh chính trị, đạo đức và năng lực thực tiễn."}]}, {"n": 10, "q": "Phân tích nội dung quan hệ chính trị với kinh tế? Liên hệ thực tiễn việc nhận thức và giải quyết mối quan hệ giữa chính trị với kinh tế ở Việt Nam?", "a": [{"t": "h", "x": "Khái niệm"}, {"t": "p", "x": "Chính trị và kinh tế là hai lĩnh vực có quan hệ mật thiết, tác động qua lại và quy định lẫn nhau trong đời sống xã hội."}, {"t": "h", "x": "Kinh tế tác động đến chính trị"}, {"t": "li", "x": "Kinh tế là cơ sở vật chất của đời sống chính trị."}, {"t": "li", "x": "Cơ cấu kinh tế ảnh hưởng đến cơ cấu xã hội và các quan hệ chính trị."}, {"t": "li", "x": "Lợi ích kinh tế là cơ sở hình thành lợi ích chính trị."}, {"t": "li", "x": "Sự phát triển kinh tế tạo điều kiện vật chất để ổn định chính trị."}, {"t": "li", "x": "Khủng hoảng kinh tế có thể gây ra bất ổn xã hội và chính trị."}, {"t": "h", "x": "Chính trị tác động đến kinh tế"}, {"t": "li", "x": "Chính trị xác định đường lối phát triển kinh tế."}, {"t": "li", "x": "Nhà nước ban hành chính sách và pháp luật điều chỉnh hoạt động kinh tế."}, {"t": "li", "x": "Chính trị tạo môi trường ổn định cho sản xuất, kinh doanh."}, {"t": "li", "x": "Cách mạng chính trị có thể tạo điều kiện cho những biến đổi về chất trong kinh tế."}, {"t": "li", "x": "Chính trị đúng đắn thúc đẩy phát triển kinh tế; chính trị sai lầm có thể cản trở kinh tế."}, {"t": "h", "x": "Liên hệ Việt Nam"}, {"t": "sub", "x": "Trong công cuộc đổi mới, Việt Nam thực hiện nguyên tắc:"}, {"t": "li", "x": "Phát triển kinh tế là nhiệm vụ trọng tâm."}, {"t": "li", "x": "Xây dựng Đảng là nhiệm vụ then chốt."}, {"t": "li", "x": "Phát triển văn hóa là nền tảng tinh thần của xã hội."}, {"t": "li", "x": "Phát triển kinh tế thị trường định hướng xã hội chủ nghĩa."}, {"t": "li", "x": "Chủ động hội nhập kinh tế quốc tế."}, {"t": "li", "x": "Kết hợp tăng trưởng kinh tế với tiến bộ và công bằng xã hội."}, {"t": "h", "x": "Kết luận"}, {"t": "p", "x": "Cần giải quyết hài hòa mối quan hệ chính trị – kinh tế, tránh tuyệt đối hóa một lĩnh vực và phải xuất phát từ thực tiễn khách quan."}]}, {"n": 11, "q": "Quyền lực chính trị là gì? Tại sao nói: Ở Việt Nam quyền lực chính trị thuộc về nhân dân?", "a": [{"t": "h", "x": "Khái niệm"}, {"t": "p", "x": "Quyền lực chính trị là quyền sử dụng sức mạnh của một hay liên minh giai cấp, tập đoàn xã hội nhằm thực hiện sự thống trị chính trị và phân bổ các giá trị xã hội."}, {"t": "h", "x": "Vì sao quyền lực chính trị ở Việt Nam thuộc về nhân dân?"}, {"t": "li", "x": "Nhân dân là chủ thể tối cao của quyền lực nhà nước."}, {"t": "li", "x": "Hiến pháp khẳng định tất cả quyền lực nhà nước thuộc về nhân dân."}, {"t": "li", "x": "Nhân dân thực hiện quyền lực thông qua dân chủ trực tiếp và dân chủ đại diện."}, {"t": "li", "x": "Nhân dân tham gia bầu cử, ứng cử và giám sát hoạt động của cơ quan nhà nước."}, {"t": "li", "x": "Nhà nước có trách nhiệm phục vụ nhân dân, bảo vệ quyền và lợi ích hợp pháp của nhân dân."}, {"t": "h", "x": "Các hình thức thực hiện quyền lực"}, {"t": "li", "x": "Thông qua bầu cử đại biểu Quốc hội và Hội đồng nhân dân."}, {"t": "li", "x": "Tham gia góp ý xây dựng chính sách, pháp luật."}, {"t": "li", "x": "Thực hiện quyền giám sát và phản biện xã hội."}, {"t": "li", "x": "Tham gia các tổ chức chính trị – xã hội."}, {"t": "li", "x": "Thực hiện quyền khiếu nại, tố cáo theo quy định pháp luật."}, {"t": "h", "x": "Kết luận"}, {"t": "p", "x": "Quyền lực chính trị ở Việt Nam thuộc về nhân dân và được tổ chức thực hiện thông qua hệ thống chính trị, dưới sự lãnh đạo của Đảng và sự quản lý của Nhà nước."}]}, {"n": 12, "q": "Văn hóa chính trị là gì. Trình bày cấu trúc văn hóa chính trị với tư cách là chủ thể chính trị. Liên hệ thực tiễn Việt Nam.", "a": [{"t": "h", "x": "Khái niệm"}, {"t": "p", "x": "Văn hóa chính trị là một lĩnh vực đặc biệt của văn hóa xã hội, phản ánh trình độ hiểu biết, nhận thức, thái độ và năng lực hoạt động chính trị của con người và các tổ chức trong đời sống chính trị."}, {"t": "h", "x": "Cấu trúc văn hóa chính trị với tư cách chủ thể chính trị"}, {"t": "sub", "x": "Gồm hai bộ phận:"}, {"t": "sub", "x": "Văn hóa chính trị cá nhân"}, {"t": "li", "x": "Trình độ hiểu biết về chính trị."}, {"t": "li", "x": "Nhận thức và giác ngộ chính trị."}, {"t": "li", "x": "Thái độ, niềm tin và tình cảm chính trị."}, {"t": "li", "x": "Khả năng tham gia hoạt động chính trị."}, {"t": "li", "x": "Mức độ hoàn thiện nhân cách."}, {"t": "sub", "x": "Văn hóa chính trị của tổ chức, cộng đồng"}, {"t": "p", "x": "Được hình thành từ:"}, {"t": "li", "x": "Văn hóa chính trị của từng cá nhân."}, {"t": "li", "x": "Văn hóa chính trị của người đứng đầu."}, {"t": "li", "x": "Trình độ dân trí."}, {"t": "li", "x": "Trình độ tổ chức và hoạt động."}, {"t": "li", "x": "Bản chất của chế độ chính trị."}, {"t": "li", "x": "Mức độ phát triển dân chủ."}, {"t": "h", "x": "Liên hệ Việt Nam"}, {"t": "sub", "x": "Cần:"}, {"t": "li", "x": "Giáo dục chủ nghĩa Mác – Lênin và tư tưởng Hồ Chí Minh."}, {"t": "li", "x": "Nâng cao hiểu biết pháp luật và ý thức công dân."}, {"t": "li", "x": "Phát huy dân chủ và quyền làm chủ của nhân dân."}, {"t": "li", "x": "Xây dựng đội ngũ cán bộ có đạo đức và năng lực."}, {"t": "li", "x": "Đấu tranh chống tham nhũng, tiêu cực."}, {"t": "li", "x": "Xây dựng môi trường văn hóa chính trị lành mạnh."}, {"t": "h", "x": "Kết luận"}, {"t": "p", "x": "Văn hóa chính trị góp phần nâng cao chất lượng hoạt động của cá nhân, tổ chức và toàn bộ hệ thống chính trị."}]}, {"n": 13, "q": "Phân tích những cơ hội và thách thức mà xu thế toàn cầu hóa và khu vực hóa đang đặt ra cho việc thực hiện định hướng xã hội chủ nghĩa ở Việt Nam. Theo anh/chị, Việt Nam có thể làm gì để tận dụng cơ hội, vượt qua thách thức và kiên định mục tiêu đã chọn?", "a": [{"t": "h", "x": "Khái niệm"}, {"t": "li", "x": "Toàn cầu hóa: Quá trình tăng cường liên kết và phụ thuộc lẫn nhau giữa các quốc gia trên phạm vi toàn thế giới."}, {"t": "li", "x": "Khu vực hóa: Quá trình các quốc gia trong cùng khu vực tăng cường hợp tác trên nhiều lĩnh vực."}, {"t": "h", "x": "Cơ hội"}, {"t": "li", "x": "Mở rộng thị trường xuất khẩu và thu hút đầu tư."}, {"t": "li", "x": "Tiếp cận khoa học, công nghệ hiện đại."}, {"t": "li", "x": "Tiếp thu kinh nghiệm quản lý và phát triển."}, {"t": "li", "x": "Tạo điều kiện nâng cao năng suất lao động."}, {"t": "li", "x": "Tăng cường giao lưu văn hóa và hợp tác quốc tế."}, {"t": "li", "x": "Nâng cao vị thế của Việt Nam trên trường quốc tế."}, {"t": "h", "x": "Thách thức"}, {"t": "li", "x": "Nguy cơ phụ thuộc vào các nền kinh tế lớn."}, {"t": "li", "x": "Cạnh tranh kinh tế và công nghệ ngày càng gay gắt."}, {"t": "li", "x": "Nguy cơ tụt hậu về khoa học và năng suất lao động."}, {"t": "li", "x": "Tác động tiêu cực đến văn hóa và bản sắc dân tộc."}, {"t": "li", "x": "Những diễn biến phức tạp về an ninh, chính trị quốc tế."}, {"t": "li", "x": "Nguy cơ gia tăng bất bình đẳng và khoảng cách giàu nghèo."}, {"t": "h", "x": "Giải pháp"}, {"t": "li", "x": "Kiên định mục tiêu độc lập dân tộc gắn liền với chủ nghĩa xã hội."}, {"t": "li", "x": "Giữ vững vai trò lãnh đạo của Đảng."}, {"t": "li", "x": "Hoàn thiện thể chế kinh tế thị trường định hướng xã hội chủ nghĩa."}, {"t": "li", "x": "Đẩy mạnh công nghiệp hóa, hiện đại hóa."}, {"t": "li", "x": "Phát triển khoa học, công nghệ và đổi mới sáng tạo."}, {"t": "li", "x": "Nâng cao chất lượng giáo dục và nguồn nhân lực."}, {"t": "li", "x": "Chủ động hội nhập quốc tế, đa phương hóa và đa dạng hóa quan hệ đối ngoại."}, {"t": "li", "x": "Bảo vệ bản sắc văn hóa dân tộc."}, {"t": "li", "x": "Kết hợp phát triển kinh tế với quốc phòng, an ninh."}, {"t": "li", "x": "Phát huy sức mạnh đại đoàn kết toàn dân tộc."}, {"t": "h", "x": "Kết luận"}, {"t": "p", "x": "Toàn cầu hóa và khu vực hóa vừa đem lại cơ hội, vừa tạo ra thách thức. Việt Nam cần chủ động tận dụng cơ hội, khắc phục hạn chế và kiên định mục tiêu phát triển đất nước theo định hướng xã hội chủ nghĩa."}]}]};

const PALETTE=[["#1f78c8","#0f4f8f"]];
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

const T='<div class="tape"></div><span class="spark" style="left:14px;bottom:12px">✨</span><span class="spark" style="right:22px;top:18px;animation-delay:-1s">⭐</span>';

/* saved progress */

/* header */
function chips(){
  const ok=Object.values(prog).filter(v=>v==="ok").length, bad=Object.values(prog).filter(v=>v==="bad").length;
  $("chips").innerHTML = '<span class="chip k">✅ '+ok+'</span><span class="chip u">❌ '+bad+'</span><span class="chip">✍️ '+Object.keys(essDone).length+'/'+ES.length+'</span>'

  $("thm").onclick = () => { const t=document.documentElement.dataset.theme==="dark"?"light":"dark"; document.documentElement.dataset.theme=t; try{localStorage.setItem("ctr_theme",t)}catch(e){}; chips(); };
}
$("tabMc").onclick = () => { tab="mc"; route(); };
$("tabEs").onclick = () => { tab="es"; route(); };
function route(){
  $("tabMc").classList.toggle("on",tab==="mc"); $("tabEs").classList.toggle("on",tab==="es");

  if(tab==="mc") S ? (S.done? renderResult() : renderQ()) : renderHome(); else renderEssayList();

}

/* ===== MULTIPLE CHOICE ===== */
function renderHome(){
  S=null;
  const ok=Object.values(prog).filter(v=>v==="ok").length, bad=Object.values(prog).filter(v=>v==="bad").length, left=MC.length-ok-bad;
  $("kb").textContent = "";
  $("main").innerHTML = '<div class="panel ent">'+T+''
   + '<h2>Trắc nghiệm ôn tập</h2><div class="muted">Kết quả gần nhất của từng câu được lưu trên máy này.</div>'
   + '<div class="bar" style="margin:12px 0 4px"><i class="k" style="width:'+ok/MC.length*100+'%"></i><i class="u" style="width:'+bad/MC.length*100+'%"></i></div>'
   + '<div class="muted" style="margin-bottom:14px">Đúng '+ok+' · Sai '+bad+' · Chưa làm '+left+'</div>'
   + '<div class="grid2">'
   + '<div class="card"><h3>📖 Luyện tập</h3><div class="muted">Chọn đáp án là biết đúng sai ngay, kèm đáp án đúng.</div>'
   +   '<select id="pf"><option value="all">Tất cả 120 câu</option><option value="new">Chưa làm ('+left+')</option><option value="bad">Câu làm sai ('+bad+')</option>'

   +   '<label class="row"><input type="checkbox" id="psh"> Xáo trộn thứ tự câu</label><button class="pri" id="goP">Bắt đầu luyện tập</button></div>'
   + '<div class="card"><h3>⏱️ Thi thử</h3><div class="muted">Làm hết rồi mới nộp bài, xem điểm và các câu sai.</div>'
   +   '<select id="ec"><option value="30">30 câu ngẫu nhiên</option><option value="60">60 câu ngẫu nhiên</option><option value="120">Cả 120 câu</option></select>'
   +   '<button class="pri" id="goE">Bắt đầu thi thử</button></div>'
   + '</div><div class="muted" style="text-align:center;margin-top:16px">🐹 Chạm vào bé hamster ở góc phải để chọc nó nha~</div></div>';
  $("goP").onclick = () => {
    const f=$("pf").value; let l=MC.map(q=>q.n);
    if(f==="new") l=l.filter(n=>!prog[n]); else if(f==="bad") l=l.filter(n=>prog[n]==="bad"); else if(f[0]==="r"){ const i=+f[1]; l=l.slice(i*30,i*30+30); }

    if($("psh").checked) l=shuffle(l);
    start("practice",l);
  };
  $("goE").onclick = () => start("exam", shuffle(MC.map(q=>q.n)).slice(0,+$("ec").value));
}
function start(mode,list){ S={mode,list,i:0,sel:{},done:false,t0:Date.now(),map:false}; renderQ(); window.scrollTo({top:0}); }
function Q(n){ return MC[n-1]; }
function renderQ(){
  const n=S.list[S.i], q=Q(n), sel=S.sel[n], practice=S.mode==="practice", locked=practice&&sel;

    + '<div class="qtxt">'+esc(q.q)+'</div><div class="opts">';

    else if(sel===L) cls+=" sel";
    h+='<button class="'+cls+'" data-l="'+L+'"'+(fresh?' style="animation-delay:'+(ix*.07)+'s"':'')+(locked?' disabled':'')+'><span class="l">'+L+'</span><span>'+esc(t)+'</span></button>';
  });
  h+='</div>';
  if(locked){
    const good=sel===q.k, kt=q.o.find(o=>o[0]===q.k)[1];
    h+='<div class="fb '+(good?'ok':'bad')+'">'+(good?'🎉 Chính xác!':'💭 Chưa đúng rồi.')+' Đáp án đúng: <b>'+q.k+'</b> – '+esc(kt)+(NOTE[q.n]?'<small>⚠️ '+esc(NOTE[q.n])+'</small>':'')+'</div>';
  }
  h+='<div class="nav"><button id="pv"'+(S.i===0?' disabled':'')+'>← Trước</button><button class="pri" id="nx">'+(S.i===S.list.length-1?(practice?'Xem kết quả':'Nộp bài'):'Sau →')+'</button></div>';
  h+='<div class="map'+(S.map?'':' hide')+'" id="map">'+S.list.map((m,i)=>{
      const s=S.sel[m]; let c=i===S.i?'cur ':''; if(s){ c+= practice ? (s===Q(m).k?'ok':'bad') : 'done'; }
      return '<button class="'+c+'" data-i="'+i+'">'+m+'</button>'; }).join("")+'</div></div>';
  $("main").innerHTML=h;
  $("kb").textContent = "Phím tắt: A B C D = chọn đáp án · ← → = chuyển câu · Enter = câu sau";
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(b.dataset.l));
  $("pv").onclick=()=>go(-1); $("nx").onclick=()=>go(1);
  $("mapb").onclick=()=>{ S.map=!S.map; $("map").classList.toggle("hide",!S.map); };
  $("quit").onclick=()=>{ if(!answered||confirm("Thoát? Phần đang làm sẽ không được lưu.")) route2home(); };
  document.querySelectorAll("#map button").forEach(b=>b.onclick=()=>{ S.i=+b.dataset.i; renderQ(); });
  if(!practice) tick();
}
function route2home(){ clearInterval(S&&S.timer); S=null; route(); }
function tick(){
  clearInterval(S.timer);
  const f=()=>{ const el=$("tm"); if(!el){ clearInterval(S.timer); return; } const s=Math.floor((Date.now()-S.t0)/1000); el.textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); };
  f(); S.timer=setInterval(f,1000);
}
function pick(L){
  const n=S.list[S.i];
  if(S.mode==="practice"){
    if(S.sel[n]) return;
    S.sel[n]=L; const ok=L===Q(n).k; prog[n]=ok?"ok":"bad"; LS.set("ctr_prog",prog); chips(); renderQ(); feel(ok); return;
  } else { S.sel[n]=L; sfx.pick(); react("hop"); }
  renderQ();
}
function go(d){
  if(d>0&&S.i===S.list.length-1){ finish(); return; }
  S.i=Math.max(0,S.i+d); renderQ(); window.scrollTo({top:0});
}
function finish(){
  const un=S.list.filter(n=>!S.sel[n]).length;
  if(S.mode==="exam"&&un&&!confirm("Còn "+un+" câu chưa trả lời. Vẫn nộp bài?")) return;
  if(S.mode==="practice"&&un&&!confirm("Còn "+un+" câu chưa làm. Xem kết quả luôn?")) return;
  clearInterval(S.timer);
  S.done=true; S.secs=Math.floor((Date.now()-S.t0)/1000);
  if(S.mode==="exam"){ S.list.forEach(n=>{ if(S.sel[n]) prog[n]=S.sel[n]===Q(n).k?"ok":"bad"; }); LS.set("ctr_prog",prog); }
  renderResult();
}
function renderResult(){
  const right=S.list.filter(n=>S.sel[n]===Q(n).k).length, total=S.list.length;
  const wrong=S.list.filter(n=>S.sel[n]!==Q(n).k), pct=Math.round(right/total*100);
  const msg=pct>=90?"Xuất sắc! 🏆":pct>=70?"Giỏi lắm! 🌈":pct>=50?"Cố thêm chút nữa nhé 💪":"Ôn lại rồi thử lại nào 🌱";
  chips();
  let h='<div class="panel ent score">'+T+'<div style="font-size:3rem">'+(pct>=70?'🎉':'💪')+'</div><h2>'+msg+'</h2><div class="pct">'+right+' / '+total+'</div>'
    +'<div class="muted">'+pct+'% · Thang 10: '+(right/total*10).toFixed(2)+(S.mode==="exam"?' · Thời gian '+Math.floor(S.secs/60)+' phút '+S.secs%60+' giây':'')+'</div>'
    +'<div class="nav"><button class="pri" id="again">🏠 Về trang chính</button>'
    +(wrong.length?'<button class="dont" id="rw">💭 Làm lại '+wrong.length+' câu sai</button>':'')+'</div>';
  if(wrong.length){
    h+='<h2 style="margin-top:20px;text-align:left">Các câu cần xem lại</h2><div class="rev">'+wrong.map(n=>{
      const q=Q(n), s=S.sel[n]; const t=l=>q.o.find(o=>o[0]===l)[1];
      return '<div class="it"><div class="q">Câu '+n+'. '+esc(q.q)+'</div>'
        +'<div class="n">'+(s?'Bạn chọn '+s+'. '+esc(t(s)):'Bạn chưa trả lời')+'</div>'
        +'<div class="y">Đáp án đúng '+q.k+'. '+esc(t(q.k))+'</div>'+(NOTE[n]?'<div class="muted">⚠️ '+esc(NOTE[n])+'</div>':'')+'</div>'; }).join("")+'</div>';
  }
  h+='</div>'; $("main").innerHTML=h; $("kb").textContent=""; finishFx(pct);
  $("again").onclick=route2home;
  if($("rw")) $("rw").onclick=()=>start("practice",shuffle(wrong));
  window.scrollTo({top:0});
}
document.addEventListener("keydown",e=>{
  if(tab!=="mc"||!S||S.done||/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  const k=e.key.toUpperCase();
  if("ABCD".includes(k)&&k.length===1&&Q(S.list[S.i]).o.some(o=>o[0]===k)) pick(k);
  else if(e.key==="ArrowRight"||e.key==="Enter") go(1); else if(e.key==="ArrowLeft") go(-1);
});

/* ===== ESSAY ===== */
function renderAns(blocks){
  let h="",ul=false;
  blocks.forEach(b=>{
    if(b.t!=="li"&&ul){ h+="</ul>"; ul=false; }
    if(b.t==="li"){ if(!ul){ h+="<ul>"; ul=true; } h+="<li>"+esc(b.x)+"</li>"; }
    else if(b.t==="h") h+="<h4>"+esc(b.x)+"</h4>";
    else if(b.t==="sub") h+='<p class="sub">'+esc(b.x)+"</p>";
    else h+="<p>"+esc(b.x)+"</p>";
  });
  return h+(ul?"</ul>":"");
}
function renderEssayList(){
  $("kb").textContent="";
  $("main").innerHTML='<div class="panel ent">'+T+'<h2>Câu hỏi tự luận</h2><div class="muted">Chọn một câu, tự viết nháp trước rồi mở đáp án gợi ý để đối chiếu. Bản nháp lưu ngay trên máy này.</div><div class="elist">'
   + ES.map(e=>'<button class="eitem" data-n="'+e.n+'"><span class="n">Câu '+e.n+'</span><span>'+esc(e.q)+'</span><span class="ck">'+(essDone[e.n]?'✅':drafts[e.n]?'📝':'')+'</span></button>').join("")+'</div></div>';
  document.querySelectorAll(".eitem").forEach(b=>b.onclick=()=>renderEssay(+b.dataset.n));
}
function renderEssay(n){
  const e=ES[n-1]; color();
  $("main").innerHTML='<div class="panel ent">'+T+'<div class="qhead"><span class="tag"><b>Câu '+n+'</b>'+n+' / '+ES.length+'</span><button class="sm" id="back">← Danh sách</button></div>'
   +'<div class="qtxt">'+esc(e.q)+'</div>'
   +'<textarea id="dr" placeholder="Viết nháp câu trả lời của bạn ở đây…">'+esc(drafts[n]||"")+'</textarea>'
   +'<div class="nav" style="margin-top:12px"><button class="pri" id="sh">👀 Xem đáp án gợi ý</button><button id="dn" class="'+(essDone[n]?'know':'')+'">'+(essDone[n]?'✅ Đã ôn':'Đánh dấu đã ôn')+'</button></div>'
   +'<div class="ans hide" id="an">'+renderAns(e.a)+'</div>'
   +'<div class="nav"><button id="pv"'+(n===1?' disabled':'')+'>← Câu trước</button><button id="nx"'+(n===ES.length?' disabled':'')+'>Câu sau →</button></div></div>';
  $("back").onclick=renderEssayList;
  $("dr").oninput=ev=>{ drafts[n]=ev.target.value; if(!drafts[n]) delete drafts[n]; LS.set("ctr_drafts",drafts); };
  $("sh").onclick=()=>{ const a=$("an"); a.classList.toggle("hide"); $("sh").textContent=a.classList.contains("hide")?"👀 Xem đáp án gợi ý":"🙈 Ẩn đáp án"; };
  $("dn").onclick=()=>{ if(essDone[n]) delete essDone[n]; else { essDone[n]=true; toast("Đã đánh dấu ôn xong 🎉"); sfx.ok(); react("hop"); say("Giỏi quá, ôn xong một câu! 🎉"); } LS.set("ctr_essdone",essDone); chips(); renderEssay(n); };
  $("pv").onclick=()=>renderEssay(n-1); $("nx").onclick=()=>renderEssay(n+1);
  window.scrollTo({top:0});
}

/* ===== cute layer ===== */
let snd=LS.get("ctr_snd",true), AC=null, raging=false;
function tone(f,t,d,v,ty){ if(!snd) return; try{ AC=AC||new(window.AudioContext||window.webkitAudioContext)(); const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime+t; o.type=ty||"sine"; o.frequency.value=f; g.gain.setValueAtTime(v||.06,n); g.gain.exponentialRampToValueAtTime(.0001,n+d); o.connect(g); g.connect(AC.destination); o.start(n); o.stop(n+d+.02); }catch(e){} }
const sfx={pick:()=>tone(520,0,.08,.04),ok:()=>{tone(660,0,.12);tone(880,.09,.18)},bad:()=>tone(330,0,.2,.05,"triangle"),done:()=>[523,659,784,1047].forEach((f,i)=>tone(f,i*.11,.25))};
const vib=p=>{ try{ navigator.vibrate&&navigator.vibrate(p) }catch(e){} };
const _chips=chips;
chips=function(){ _chips(); const b=document.createElement("button"); b.className="ib"; b.title="Âm thanh"; b.textContent=snd?"🔊":"🔇";
  b.onclick=()=>{ snd=!snd; LS.set("ctr_snd",snd); b.textContent=snd?"🔊":"🔇"; if(snd) sfx.ok(); }; $("chips").insertBefore(b,$("thm")); };

/* floating mascot */
const mas=document.createElement("div"); mas.className="mas"; mas.id="mas"; mas.innerHTML='<div class="bubble" id="bub"></div><div id="mi"></div>'; document.body.appendChild(mas);
function newMascot(){ $("mi").innerHTML='<img src="'+HS[Math.floor(Math.random()*HS.length)]+'" alt="">'; }
newMascot();
let bt; function say(t,ms){ const b=$("bub"); b.textContent=t; b.classList.add("on"); clearTimeout(bt); bt=setTimeout(()=>b.classList.remove("on"),ms||2600); }
const ANI=["hop","m-spin","m-wig","m-sq"];
function react(a){ if(raging) return; ANI.forEach(c=>mas.classList.remove(c)); void mas.offsetWidth; mas.classList.add(a); clearTimeout(mas._t); mas._t=setTimeout(()=>mas.classList.remove(a),1000); }
const pick1=a=>a[Math.floor(Math.random()*a.length)];
const GR=["Học thôi nào! 📚","Hôm nay ôn gì nè? 🌟","Cố lên bạn ơi! 💪","Chạm vào mình đi~ 🐹"];
function greet(){ say(pick1(GR),2200); }

/* effects */
function burst(el,emoji){ const r=el.getBoundingClientRect();
  for(let i=0;i<7;i++){ const e=document.createElement("div"); e.className="rise"; e.textContent=emoji[i%emoji.length];
    e.style.left=(r.left+r.width/2+(Math.random()-.5)*Math.min(r.width,240)*.6)+"px"; e.style.top=(r.top+Math.min(r.height,40)/2)+"px";
    e.style.setProperty("--dx",((Math.random()-.5)*110)+"px"); e.style.setProperty("--r",((Math.random()-.5)*60)+"deg");
    e.style.animationDelay=(i*.05)+"s"; document.body.appendChild(e); setTimeout(()=>e.remove(),1500); } }
const cv=document.createElement("canvas"); cv.id="cv"; document.body.appendChild(cv); const cx=cv.getContext("2d"); let ps=[],raf=0;
function fitCv(){ cv.width=innerWidth*devicePixelRatio; cv.height=innerHeight*devicePixelRatio } fitCv(); addEventListener("resize",fitCv);
function tickCv(){ cx.clearRect(0,0,cv.width,cv.height); const k=devicePixelRatio;
  ps=ps.filter(p=>p.y<cv.height+40&&p.l>0);
  ps.forEach(p=>{ p.vy+=.18*k; p.vx*=.992; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.l--; cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.globalAlpha=Math.min(1,p.l/40); cx.fillStyle=p.c;
    if(p.s) cx.fillRect(-p.w/2,-p.h/2,p.w,p.h); else { cx.beginPath(); cx.arc(0,0,p.w/2,0,7); cx.fill(); } cx.restore(); });
  raf=ps.length?requestAnimationFrame(tickCv):0; }
function confetti(){ const k=devicePixelRatio,col=["#1f78c8","#4aa3e8","#7fd8be","#9ad0f5","#ffd86b","#ffffff"];
  for(let i=0;i<150;i++){ const a=Math.random()*Math.PI*2,sp=(6+Math.random()*9)*k,f=i%2;
    ps.push({x:cv.width*(f?.15:.85),y:cv.height*.85,vx:Math.cos(a)*sp*.6+(f?4:-4)*k,vy:-(8+Math.random()*10)*k,w:(6+Math.random()*7)*k,h:(4+Math.random()*5)*k,r:0,vr:(Math.random()-.5)*.4,c:col[i%col.length],s:i%3>0,l:140+Math.random()*80}); }
  if(!raf) raf=requestAnimationFrame(tickCv); }
document.addEventListener("pointerdown",e=>{ const b=e.target.closest&&e.target.closest("button"); if(!b) return;
  const r=b.getBoundingClientRect(),s=Math.max(r.width,r.height)*2.2,p=document.createElement("span");
  p.className="rp"; p.style.cssText="width:"+s+"px;height:"+s+"px;left:"+(e.clientX-r.left-s/2)+"px;top:"+(e.clientY-r.top-s/2)+"px"; b.appendChild(p); setTimeout(()=>p.remove(),650); });

/* reactions to answers */
let combo=0;
const CH_OK=["Giỏi quá! 🎉","Chuẩn luôn! ✨","Đỉnh của chóp! 💖","Yeah! Đúng rồi! 🌟","Hamster tự hào quá! 🐹"];
const CH_BAD=["Hic, chưa đúng 🥺","Không sao, nhớ lại nha 💪","Lần sau sẽ đúng! 🌱","Xem đáp án rồi nhớ nè 📖"];
function feel(ok){
  combo=ok?combo+1:0;
  if(ok){ sfx.ok(); vib([15,40,15]); react(combo>=5?"m-spin":"hop"); say(combo>=3?"🔥 Combo x"+combo+"!":pick1(CH_OK));
    const o=document.querySelector(".opt.ok"); if(o) burst(o,["💖","✨","⭐"]);
    if(combo>=3&&combo%3===0){ confetti(); toast("🔥 Combo x"+combo+"!"); } }
  else { sfx.bad(); vib(30); react("m-wig"); say(pick1(CH_BAD)); const o=document.querySelector(".opt.bad"); if(o) burst(o,["💭","🌱","💪"]); }
}
function finishFx(pct){ if(S._fx) return; S._fx=1;
  if(pct>=70){ confetti(); sfx.done(); react("m-spin"); say(pct>=90?"Xuất sắc luôn! 🏆":"Giỏi lắm! 🌈",4000); }
  else { react("m-sq"); say("Cố lên, ôn lại nha! 💪",4000); } }

/* poke the hamster */
function bigSay(txt,col,dur,sc,sub){ const d=document.createElement("div");
  d.innerHTML="<div>"+txt+"</div>"+(sub?'<div style="font-size:.38em;margin-top:.15em">'+sub+"</div>":"");
  d.style.cssText="position:fixed;left:50%;top:50%;z-index:97;pointer-events:none;text-align:center;white-space:nowrap;font:900 min("+(15*sc)+"vw,"+(5.6*sc)+"rem)/1.05 Fredoka,Nunito,sans-serif;color:"+col+";text-shadow:-4px -4px 0 #fff,4px -4px 0 #fff,-4px 4px 0 #fff,4px 4px 0 #fff,0 10px 0 rgba(0,0,0,.28)";
  document.body.appendChild(d); const T0="translate(-50%,-50%) ";
  d.animate([{transform:T0+"scale(0) rotate(-14deg)",opacity:0},{transform:T0+"scale(1.4) rotate(6deg)",opacity:1,offset:.18},{transform:T0+"scale(1) rotate(-3deg)",offset:.3},{transform:T0+"scale(1.04) rotate(2deg)",offset:.5},{transform:T0+"scale(1) rotate(-2deg)",opacity:1,offset:.75},{transform:T0+"scale(1.2) rotate(0)",opacity:0}],{duration:dur,easing:"ease-out"}).onfinish=()=>d.remove(); }
const SAY=["Ui da! 😆","Nhột quá! 🤭","Hihi~ 💕","Nhảy nè! 🎵","Ê đừng chọc nữa~ 😝","Yêu quá đi! 💖","Học tiếp thôi! 📚"];
let taps=[];
function poke(e){ e.stopPropagation(); if(raging) return;
  const a=pick1(ANI); react(a); burst(mas,["💖","✨","⭐","🎵"]); tone(500+Math.random()*500,0,.12,.05,"triangle"); vib(12);
  say(pick1(SAY),1800);
  const n=Date.now(); taps=taps.filter(x=>n-x<2200); taps.push(n);
  if(taps.length===5) say("Này! Đừng chọc nữa! 😠",1800);
  if(taps.length>=8){ taps=[]; rage(); } }
function rage(){ const img=mas.querySelector("img"); if(!img||raging) return; raging=true;
  const r=img.getBoundingClientRect(),c=img.cloneNode();
  c.style.cssText="position:fixed;left:"+r.left+"px;top:"+r.top+"px;width:"+r.width+"px;height:"+r.height+"px;z-index:90;pointer-events:none;transform-origin:50% 100%;animation:none;filter:sepia(1) saturate(9) hue-rotate(-50deg) drop-shadow(0 0 12px red)";
  document.body.appendChild(c); mas.style.visibility="hidden";
  burst(c,["💢","😡","🔥"]); tone(110,0,.7,.08,"sawtooth"); vib([60,40,60,40,120]); bigSay("😡 GRRR!","#e5484d",1300,.8,"Hamster nổi giận rồi!");
  const kf=[]; for(let i=0;i<12;i++) kf.push({transform:"translate("+(i%2?7:-7)+"px,"+(i%3?-3:3)+"px) rotate("+(i%2?9:-9)+"deg) scale("+(1.1+i*.03)+")"});
  c.animate(kf,{duration:950,easing:"ease-in-out",fill:"forwards"}).onfinish=()=>{
    const dx=innerWidth/2-(r.left+r.width/2), dy=innerHeight/2-(r.top+r.height); tone(200,0,.5,.07,"sawtooth");
    c.animate([{transform:"translate(0,0) scale(1.4)"},{transform:"translate("+dx*.5+"px,"+dy*.5+"px) scale(4.5) rotate(-8deg)",offset:.6},{transform:"translate("+dx+"px,"+dy+"px) scale(15)"}],{duration:620,easing:"cubic-bezier(.6,0,1,.6)",fill:"forwards"}).onfinish=()=>{
      c.remove();
      const f=document.createElement("div"); f.style.cssText="position:fixed;inset:0;background:#fff;z-index:95;pointer-events:none"; document.body.appendChild(f);
      f.animate([{opacity:.95},{opacity:0}],{duration:520}).onfinish=()=>f.remove();
      const bm=document.createElement("div"); bm.textContent="💥"; bm.style.cssText="position:fixed;left:50%;top:50%;font-size:46vmin;z-index:96;pointer-events:none;margin:-23vmin 0 0 -23vmin;line-height:1"; document.body.appendChild(bm);
      bm.animate([{transform:"scale(.3) rotate(-15deg)",opacity:1},{transform:"scale(1.3) rotate(8deg)",opacity:1,offset:.5},{transform:"scale(1.5)",opacity:0}],{duration:800}).onfinish=()=>bm.remove();
      document.body.animate([{transform:"translate(0,0)"},{transform:"translate(-18px,10px)"},{transform:"translate(16px,-12px)"},{transform:"translate(-12px,-8px)"},{transform:"translate(8px,6px)"},{transform:"translate(0,0)"}],{duration:480});
      tone(70,0,.5,.16,"square"); tone(45,.05,.6,.16,"sawtooth"); vib([200,60,120]); bigSay("BÙM!","#ffc928",1500,1.4,"Đau quá...");
      setTimeout(()=>{ mas.style.visibility=""; raging=false; react("m-sq"); say("Hết giận rồi nha~ 🥺",3000); },1700); }; }; }
mas.addEventListener("pointerdown",poke);

route();

<script>
(function(){
  var standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  if (standalone) return;
  var btn = document.getElementById('pwaBtn'), tip = document.getElementById('pwaTip'), dp = null;
  try { if (localStorage.getItem('pwa_dismiss')) return; } catch(e) {}
  var ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); dp = e; btn.style.display='flex'; });
  if (ios) btn.style.display='flex';
  btn.addEventListener('click', function(ev){
    if (ev.target.className==='x'){ btn.style.display='none'; tip.style.display='none'; try{localStorage.setItem('pwa_dismiss','1');}catch(e){} return; }
    if (dp){ dp.prompt(); dp = null; btn.style.display='none'; return; }
    tip.innerHTML = ios ? 'Bấm nút <b>Chia sẻ</b> ⎋ ở thanh Safari → chọn <b>Thêm vào MH chính</b> (Add to Home Screen).'
                        : 'Mở menu ⋮ của trình duyệt → chọn <b>Thêm vào màn hình chính</b> / <b>Cài đặt ứng dụng</b>.';
    tip.style.display = tip.style.display==='block' ? 'none' : 'block';
  });
  window.addEventListener('appinstalled', function(){ btn.style.display='none'; tip.style.display='none'; });
})();
</script>
